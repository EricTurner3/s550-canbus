<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S550 Live Test</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --line: #dfe2e7; --text: #1c2026; --muted: #6a7280;
    --accent: #1f6feb; --accent-soft: #e3edfd; --on: #1a9e5a; --on-soft: #dcf3e6;
    --flash: #c77c02; --flash-soft: #fbeed3; --warn: #c93636; --warn-soft: #fbe2e2;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101317; --panel: #181c22; --line: #2a3039; --text: #e4e7eb; --muted: #8b94a1;
      --accent: #58a6ff; --accent-soft: #15253b; --on: #3fcf86; --on-soft: #12301f;
      --flash: #f0b44c; --flash-soft: #352812; --warn: #f47174; --warn-soft: #3a1a1b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
           padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; }
  h1 { font-size: 16px; margin: 0; }
  .stat { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .stat b { color: var(--text); font-weight: 600; }
  .stat.bad b { color: var(--warn); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 16px; padding: 16px; align-items: start; }
  @media (max-width: 1100px) { main { grid-template-columns: minmax(0, 1fr); } }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; align-items: start; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px;
             display: flex; justify-content: space-between; align-items: center; }
  .field { padding: 8px 0; border-top: 1px solid var(--line); }
  .card h2 + .field { border-top: 0; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
  .ctl { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .name { font-family: var(--mono); font-size: 12.5px; flex: 0 1 auto; min-width: 0; overflow-wrap: anywhere; }
  .hint { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .badge { font-size: 10.5px; padding: 1px 6px; border-radius: 10px; background: var(--warn-soft); color: var(--warn);
           white-space: nowrap; }
  input[type=range] { width: 100%; margin: 6px 0 0; accent-color: var(--accent); }
  input[type=number] { width: 90px; font: 12.5px var(--mono); padding: 3px 5px; border: 1px solid var(--line);
                       border-radius: 4px; background: var(--bg); color: var(--text); text-align: right; }
  .unit { font-size: 12px; color: var(--muted); min-width: 34px; }
  .alt { font-size: 11.5px; color: var(--muted); font-family: var(--mono); min-width: 52px; text-align: right; }
  button { font: inherit; font-size: 12.5px; border: 1px solid var(--line); background: var(--panel); color: var(--text);
           border-radius: 5px; padding: 4px 10px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.small { font-size: 11px; padding: 1px 8px; text-transform: none; letter-spacing: 0; }
  .seg { display: inline-flex; }
  .seg button { border-radius: 0; margin-left: -1px; min-width: 50px; }
  .seg button:first-child { border-radius: 5px 0 0 5px; margin-left: 0; }
  .seg button:last-child { border-radius: 0 5px 5px 0; }
  .seg button.sel[data-v="0"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .seg button.sel[data-v="1"] { background: var(--on-soft); border-color: var(--on); color: var(--on); }
  .seg button.sel[data-v="2"] { background: var(--flash-soft); border-color: var(--flash); color: var(--flash); }
  .toggle { min-width: 56px; }
  .toggle.on { background: var(--on-soft); border-color: var(--on); color: var(--on); font-weight: 600; }
  .toggle.on.warnish { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
  .side { display: grid; gap: 16px; position: sticky; top: 64px; }
  .scenarios { display: flex; flex-wrap: wrap; gap: 6px; }
  .scenarios button.running { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pad { display: grid; grid-template-columns: repeat(3, 48px); gap: 4px; justify-content: start; }
  .pad button { height: 36px; padding: 0; }
  .pad-wrap { display: flex; gap: 16px; align-items: center; }
  .frames { max-height: 52vh; overflow: auto; }
  table { border-collapse: collapse; width: 100%; font: 12px var(--mono); }
  th { text-align: left; color: var(--muted); font-weight: 500; position: sticky; top: 0; background: var(--panel); }
  td, th { padding: 2px 4px; white-space: nowrap; }
  td.b { padding: 2px 2px; transition: background .6s; }
  td.b.chg { background: var(--flash-soft); color: var(--flash); transition: none; }
  td.hz { color: var(--muted); text-align: right; }
  .note { font-size: 11.5px; color: var(--muted); margin: 6px 0 0; }
  @media (max-width: 500px) {
    main { padding: 16px; }
    .cards { grid-template-columns: minmax(0, 1fr); }
  }
</style>
</head>
<body>
<header>
  <h1>S550 Live Test</h1>
  <span class="stat">bus <b id="channel">…</b></span>
  <span class="stat"><b id="fps">0</b> frames/s</span>
  <span class="stat" id="failsWrap"><b id="fails">0</b> failed</span>
  <span class="stat" id="conn"></span>
  <span style="flex:1"></span>
  <button id="resetAll">Reset all to defaults</button>
</header>
<main>
  <div class="cards" id="cards"></div>
  <div class="side">
    <section class="card">
      <h2>Scenarios <button class="small" id="stopAnim">Stop</button></h2>
      <div class="scenarios" id="scenarios"></div>
      <p class="note">Animated scenarios run in the page and send values about 30 times a second. Moving any control stops them.</p>
    </section>
    <section class="card">
      <h2>Menu buttons (0x81)</h2>
      <div class="pad-wrap">
        <div class="pad">
          <span></span><button data-nav="up">▲</button><span></span>
          <button data-nav="left">◀</button><button data-nav="enter">OK</button><button data-nav="right">▶</button>
          <span></span><button data-nav="down">▼</button><span></span>
        </div>
        <p class="note">Arrow keys and Enter work too while focus isn't on a control.</p>
      </div>
    </section>
    <section class="card">
      <h2>Frames sent <span class="stat" id="frameCount"></span></h2>
      <div class="frames">
        <table><thead><tr><th>ID</th><th>name</th><th>Hz</th><th colspan="8">data</th></tr></thead>
        <tbody id="frameRows"></tbody></table>
      </div>
    </section>
  </div>
</main>
<script>
const fields = {};          // name -> {meta, value, render(v)}
let pending = {};
let anim = null;

const $ = (s, el = document) => el.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  for (const k of kids) if (k != null) e.append(k);
  return e;
};

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  return r.json();
}

// coalesce rapid slider moves into one POST every 40ms
setInterval(() => {
  if (!Object.keys(pending).length) return;
  const batch = pending; pending = {};
  api('/api/set', batch).then(() => conn(true), () => conn(false));
}, 40);

function conn(ok) { $('#conn').textContent = ok ? '' : 'server not responding'; $('#conn').style.color = 'var(--warn)'; }

function setValue(name, v, fromUser = true) {
  const f = fields[name]; if (!f) return;
  if (fromUser && anim) stopAnim();
  f.value = v; f.render(v); pending[name] = v;
}
function get(name) { return fields[name] ? fields[name].value : 0; }

function fmt(v, step) {
  const d = String(step).includes('.') ? String(step).split('.')[1].length : 0;
  return Number(v).toFixed(d);
}
function altText(meta, v) {
  if (meta.unit === 'C') return Math.round(v * 9 / 5 + 32) + '°F';
  if (meta.name === 'value_boost') return v < 0 ? (-v * 2.036).toFixed(1) + ' inHg' : (v * 6.895).toFixed(0) + ' kPa';
  if (meta.unit === 'm/s²') return (v / 9.81).toFixed(2) + ' g';
  if (meta.name === 'value_speed') return Math.round(v * 1.609) + ' km/h';
  return '';
}

function buildField(meta) {
  const name = meta.name;
  const head = el('div', {class: 'row'}, el('span', {class: 'name', title: name}, name),
                  meta.wired ? null : el('span', {class: 'badge', title: "s550_cluster.py never reads this field"}, 'not sent'));
  const ctl = el('span', {class: 'ctl'});
  head.append(ctl);
  const box = el('div', {class: 'field'}, head);
  let render;

  if (meta.kind === 'tri') {
    const labels = {0: 'Off', 1: 'On', 2: 'Flash'};
    const seg = el('div', {class: 'seg'});
    for (const s of meta.states || [0, 1, 2])
      seg.append(el('button', {'data-v': s, onclick: () => setValue(name, s)}, labels[s]));
    ctl.append(seg);
    render = v => seg.querySelectorAll('button').forEach(b => b.classList.toggle('sel', +b.dataset.v === +v));
  } else if (meta.kind === 'switch' || meta.kind === 'bool') {
    const isBool = meta.kind === 'bool';
    const btn = el('button', {class: 'toggle' + (name.startsWith('warning_') ? ' warnish' : ''),
                              onclick: () => setValue(name, isBool ? !fields[name].value : (fields[name].value ? 0 : 1))});
    ctl.append(btn);
    render = v => { btn.classList.toggle('on', !!v); btn.textContent = v ? 'ON' : 'off'; };
  } else {
    const step = meta.step ?? 'any';
    const num = el('input', {type: 'number', step, ...(meta.min != null && {min: meta.min}), ...(meta.max != null && {max: meta.max})});
    const alt = el('span', {class: 'alt'});
    num.addEventListener('change', () => setValue(name, parseFloat(num.value) || 0));
    ctl.append(alt, num, el('span', {class: 'unit'}, meta.unit || ''));
    let slider = null;
    if (meta.kind === 'range') {
      slider = el('input', {type: 'range', min: meta.min, max: meta.max, step});
      slider.addEventListener('input', () => setValue(name, parseFloat(slider.value)));
      box.append(slider);
    }
    render = v => {
      if (document.activeElement !== num) num.value = meta.step ? fmt(v, meta.step) : v;
      if (slider) slider.value = v;
      alt.textContent = altText(meta, v);
    };
  }
  if (meta.hint) box.append(el('div', {class: 'hint'}, meta.hint));
  fields[name] = {meta, value: meta.value, render};
  render(meta.value);
  return box;
}

function build(list) {
  const cards = $('#cards'); cards.innerHTML = '';
  for (const k in fields) delete fields[k];
  const groups = {};
  for (const m of list) (groups[m.group] ||= []).push(m);
  for (const [g, ms] of Object.entries(groups)) {
    const h = el('h2', {}, g);
    if (ms.some(m => m.kind === 'bool' || m.kind === 'tri')) {
      h.append(el('button', {class: 'small', onclick: () => ms.forEach(m => {
        if (m.kind === 'bool') setValue(m.name, false); else if (m.kind === 'tri') setValue(m.name, 0);
      })}, 'All off'));
    }
    cards.append(el('section', {class: 'card'}, h, ...ms.map(buildField)));
  }
}

// ---- scenarios ----
// animated ones return a function of seconds elapsed -> values; one-shots are applied once
const G = 9.81;
const tri = t => 1 - Math.abs((t % 2) - 1);   // 0 -> 1 -> 0 every 2 units
const SCENARIOS = [
  ['Gauge sweep', t => ({value_rpm: Math.round(tri(t / 2) * get('value_rpm_max')), value_speed: Math.round(tri(t / 2) * 160)})],
  ['Rev limiter', t => ({value_rpm: Math.round(get('value_rpm_max') * (0.9 + 0.08 * Math.abs(Math.sin(t * 9)))), value_speed: 0})],
  ['Drive', t => {
    // accelerate through gears then brake, repeats every 14s
    const c = t % 14, gear = Math.min(4, Math.floor(c / 2.5));
    const speed = c < 10 ? c * 12 : Math.max(0, 120 - (c - 10) * 30);
    const rpm = c < 10 ? 2500 + ((c % 2.5) / 2.5) * 4500 : 900 + speed * 20;
    return {value_speed: Math.round(speed), value_rpm: Math.round(rpm),
            accel_longitudinal: +(c < 10 ? 4 - gear * 0.6 : -8).toFixed(1), accel_lateral: 0,
            value_boost: +(c < 10 ? 4 + ((c % 2.5) / 2.5) * 12 : -10).toFixed(1)};
  }],
  ['G-meter circle', t => ({accel_lateral: +(Math.cos(t * 2) * G).toFixed(2), accel_longitudinal: +(Math.sin(t * 2) * G).toFixed(2)})],
  ['Boost sweep', t => ({value_boost: +(-14.7 + tri(t / 2) * 34.7).toFixed(1)})],
  ['AFR sweep', t => ({value_afr: +(10 + tri(t / 3) * 8).toFixed(1)})],
  ['Temps sweep', t => ({oil_temp: Math.round(36 + tri(t / 4) * 122), engine_temp: Math.round(20 + tri(t / 4) * 120),
                         cylinder_head_temp: Math.round(60 + tri(t / 4) * 111), intake_temp: Math.round(-18 + tri(t / 4) * 134)})],
  ['Hazards', {icon_left_signal: 2, icon_right_signal: 2}],
  ['Idle', {value_rpm: 800, value_speed: 0, value_boost: -10, accel_lateral: 0, accel_longitudinal: 0}],
  ['Cold start', {oil_temp: 15, engine_temp: 15, cylinder_head_temp: 15, intake_temp: 10}],
  ['Overheat', {engine_temp: 140, oil_temp: 150, cylinder_head_temp: 165}],
  ['Low tires', {tire_pressure_fl: 20, tire_pressure_fr: 21, tire_pressure_rr: 19, tire_pressure_rl: 22,
                 warning_tire_low_fl: true, warning_tire_low_fr: true, warning_tire_low_rr: true, warning_tire_low_rl: true}],
  ['All icons on', () => Object.fromEntries(Object.values(fields).filter(f => f.meta.kind === 'tri').map(f => [f.meta.name, 1]))],
  ['Engine off', {engine_on: 0, value_rpm: 0, value_speed: 0}],
];

function stopAnim() {
  if (anim) cancelAnimationFrame(anim.raf);
  anim = null;
  document.querySelectorAll('#scenarios button').forEach(b => b.classList.remove('running'));
}
function apply(values) { for (const [k, v] of Object.entries(values)) setValue(k, v, false); }

for (const [label, s] of SCENARIOS) {
  const btn = el('button', {onclick: () => {
    stopAnim();
    if (typeof s === 'function' && s.length === 1) {
      btn.classList.add('running');
      const t0 = performance.now();
      let last = 0;
      const tick = now => {
        if (now - last > 33) { last = now; apply(s((now - t0) / 1000)); }
        anim.raf = requestAnimationFrame(tick);
      };
      anim = {raf: requestAnimationFrame(tick)};
    } else {
      apply(typeof s === 'function' ? s() : s);
    }
  }}, label);
  $('#scenarios').append(btn);
}
$('#stopAnim').onclick = stopAnim;

$('#resetAll').onclick = async () => { stopAnim(); pending = {}; build((await api('/api/reset', {})).fields); };

// ---- menu nav ----
const nav = d => api('/api/nav', {direction: d});
document.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => nav(b.dataset.nav));
const KEYS = {ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', Enter: 'enter'};
document.addEventListener('keydown', e => {
  if (!KEYS[e.key] || e.target.closest('input')) return;
  if (e.key === 'Enter' && e.target.tagName === 'BUTTON') return;
  e.preventDefault(); nav(KEYS[e.key]);
});

// ---- frame table ----
const hex = (n, w = 2) => n.toString(16).toUpperCase().padStart(w, '0');
const rows = {};
async function pollFrames() {
  try {
    const r = await api('/api/frames');
    conn(true);
    let total = 0;
    for (const f of r.frames) {
      total += f.hz;
      let row = rows[f.id];
      if (!row) {
        const tr = el('tr', {}, el('td', {}, '0x' + hex(f.id, 3)), el('td', {}, f.name), el('td', {class: 'hz'}));
        const cells = [];
        for (let i = 0; i < 8; i++) { const td = el('td', {class: 'b'}); cells.push(td); tr.append(td); }
        row = rows[f.id] = {tr, cells, hz: tr.children[2]};
        // keep rows sorted by ID
        const after = Object.keys(rows).map(Number).filter(id => id > f.id).sort((a, b) => a - b)[0];
        $('#frameRows').insertBefore(tr, after !== undefined ? rows[after].tr : null);
      }
      row.hz.textContent = f.hz;
      f.data.forEach((b, i) => {
        const td = row.cells[i], t = hex(b);
        if (td.textContent && td.textContent !== t) { td.classList.add('chg'); requestAnimationFrame(() => requestAnimationFrame(() => td.classList.remove('chg'))); }
        td.textContent = t;
      });
    }
    $('#fps').textContent = total;
    $('#fails').textContent = r.fails;
    $('#failsWrap').classList.toggle('bad', r.fails > 0);
    $('#frameCount').textContent = r.frames.length + ' IDs';
  } catch { conn(false); }
  setTimeout(pollFrames, 400);
}

(async () => {
  const s = await api('/api/schema');
  $('#channel').textContent = s.channel + (s.dummydata ? ' + dummy data' : '');
  build(s.fields);
  pollFrames();
})();
</script>
</body>
</html>
